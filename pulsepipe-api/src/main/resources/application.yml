server:
  port: 8080

spring:
  application:
    name: pulsepipe
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:pulsepipe}}
    username: ${POSTGRES_USER:pulsepipe}
    password: ${POSTGRES_PASSWORD:pulsepipe}
    hikari:
      pool-name: pulsepipe-db
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

logging:
  level:
    root: INFO
    com.pulsepipe: INFO
    org.apache.kafka: WARN
    org.eclipse.paho: WARN

pulsepipe:
  mqtt:
    enabled: ${MQTT_INGEST_ENABLED:true}
    broker: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    client-id: pulsepipe-ingest-1
    username: ${MQTT_USERNAME:pulsepipe}
    password: ${MQTT_PASSWORD:pulsepipe}
    topic-filter: device/+/telemetry
    qos: 1
    clean-session: false
    queue-capacity: 10000
    dispatcher-threads: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    topic: pulsepipe.events
    topic-partitions: 3
    topic-replication-factor: 1
    producer:
      batch-size: 65536
      linger-ms: 10
      buffer-memory: 33554432
    consumer:
      group-id: pulsepipe-consumer
      concurrency: 3
      max-poll-records: 1000
      handler-max-retries: 3
      handler-retry-backoff-ms: 1000
  rustfs:
    endpoint: http://${RUSTFS_HOST:localhost}:${RUSTFS_S3_PORT:9000}
    access-key: ${RUSTFS_ACCESS_KEY:pulsepipe}
    secret-key: ${RUSTFS_SECRET_KEY:change-me}
    bucket: ${STORAGE_BUCKET:pulsepipe}
    verify-on-startup: false
